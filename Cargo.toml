[package]
name = "longrange"
version = "0.2.3"
edition = "2021"
default-run = "longrange"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d"] }
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts"] }
# Not used directly: turns on the OpenGL backend in the renderer Bevy uses (Settings -> Graphics API).
wgpu = { version = "30", default-features = false, features = ["gles"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows: build the DXC shader compiler in. Without it DirectX 12 falls back to the old FXC
# compiler, which is extremely slow on (or fails) Bevy's PBR shaders: black 3D view, working UI.
[target.'cfg(windows)'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "statically-linked-dxc"] }

# Fast-ish incremental builds of our code, fully optimised engine.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
