[package]
name = "longrange"
version = "0.3.1"
edition = "2021"
default-run = "longrange"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d"] }
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts"] }
# Not used directly: turns on the OpenGL backend in the renderer Bevy uses (Settings -> Graphics API).
wgpu = { version = "30", default-features = false, features = ["gles"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
libm = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows (MSVC builds): build the DXC shader compiler in. Without it DirectX 12 falls back to the old
# FXC compiler, which is extremely slow on (or fails) Bevy's PBR shaders: black 3D view, working UI.
# wgpu can only link DXC statically with MSVC. The MinGW cross build from Linux ships dxcompiler.dll
# next to the exe instead (scripts/release.sh), which settings::render_plugin picks up.
[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "statically-linked-dxc"] }

[features]
default = ["audio"]
# Sound effects. On Linux this needs the ALSA development files at build time (Debian/Ubuntu:
# `sudo apt install libasound2-dev`); build with `--no-default-features` to leave sound out.
audio = ["bevy/bevy_audio", "bevy/wav", "bevy/vorbis"]
# Development only: `cargo run --features dev` links Bevy as a shared library, so a change to our code
# relinks in seconds instead of relinking the whole engine. Never use it for release builds.
dev = ["bevy/dynamic_linking"]

# Fast-ish incremental builds of our code, fully optimised engine.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
